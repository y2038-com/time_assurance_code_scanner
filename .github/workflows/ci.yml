name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest

      # Gate on the breakage class only: syntax errors and statements that cannot
      # run. The tree does not pass a full lint yet, so the wider report below is
      # informational until that debt is paid.
      - name: Lint (blocking subset)
        run: ruff check --select E9,F63,F7 .

      - name: Lint (full report, informational)
        continue-on-error: true
        run: ruff check .
